<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChordForge – Prontuario accordi</title>
<link rel="stylesheet" href="style.css">
<style>
body { margin:0; background:#eee; }
.bar { display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; }
.roots { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
.roots button, .types button { font-size:15px; padding:6px 10px; min-width:48px; border:1.5px solid #111; background:#fff; border-radius:6px; cursor:pointer; font-weight:700; }
.roots button.on, .types button.on { background:#111; color:#fff; }
.types { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
.types button { font-weight:500; font-size:14px; }
#search { font-size:16px; padding:7px 10px; width:220px; border:1.5px solid #111; border-radius:6px; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
.ch { border:1px solid #ccc; border-radius:8px; padding:8px 6px; text-align:center; background:#fff; break-inside:avoid; }
.ch .n { font-size:19px; font-weight:800; }
.ch .t { font-size:12px; color:#555; }
.ch .f { font-size:11.5px; color:#333; margin:2px 0; }
.ch .notes { font-size:12px; font-weight:600; margin-bottom:2px; }
.ch .alt { display:flex; justify-content:center; gap:2px; }
.ch .more { font-size:11px; color:#555; }
h2 { margin:0 0 10px; }
.grp { grid-column:1/-1; margin:10px 0 0; font-size:16px; border-bottom:2px solid #111; padding-bottom:3px; }
.grp:first-child { margin-top:0; }
.hint { color:#555; font-size:13px; }
@media print { body { background:#fff; } .cf-wrap { margin:0; max-width:none; } .grid { grid-template-columns:repeat(5,1fr); gap:8px; } }
</style></head><body>
<nav class="cf-nav"><a class="brand" href="index.html">Chord<span>Forge</span></a>
  <a class="lnk" href="index.html">Spartito</a><a class="lnk on" href="accordi.html">Prontuario accordi</a><a class="lnk" href="teoria.html">Teoria</a></nav>
<div class="cf-wrap">
  <div class="cf-card noprint">
    <div class="bar">
      <span>Notazione: <span class="cf-seg" id="nota"><button data-v="it" class="on">DO RE MI</button><button data-v="en">C D E</button></span></span>
      <span>Vedi: <span class="cf-seg" id="mode"><button data-v="root" class="on">Per nota</button><button data-v="type">Per tipo</button></span></span>
      <span><input id="search" placeholder="Cerca: es. FA#m7, Bb7…"></span>
      <button onclick="window.print()" style="font-size:14px;padding:6px 12px">Stampa</button>
    </div>
    <div class="roots" id="roots"></div>
    <div class="types" id="types" style="display:none"></div>
    <p class="hint">Pallino pieno = dito sul tasto · ○ = corda a vuoto · × = corda da non suonare · barra = barré. Il numero a destra indica il tasto di partenza.</p>
  </div>
  <div class="cf-card"><h2 id="title"></h2><div class="grid" id="grid"></div></div>
</div>
<script src="chords.js"></script>
<script>
let st = { nota:"it", mode:"root", root:"C", type:"maj" };
try { Object.assign(st, JSON.parse(localStorage.getItem("cf-accordi")||"{}")); st.nota = localStorage.getItem("cf-nota") || st.nota; } catch(e){}
const N = n => CF.noteName(n, st.nota);
const save = () => { try { localStorage.setItem("cf-accordi", JSON.stringify(st)); localStorage.setItem("cf-nota", st.nota); } catch(e){} };

function card(rootName, type, label){
  const pc = CF.pcOf(rootName[0], rootName.slice(1));
  const vs = CF.voicings(pc, type), t = CF.TYPE[type];
  const notes = CF.spell(rootName, t.deg).map(x=>N(x.name)).join(" ");
  const alt = vs.slice(1,3).map(v=>CF.diagram(v,{width:58})).join("");
  return `<div class="ch"><div class="n">${label||N(rootName)+t.suf}</div><div class="t">${t.label}</div>
    <div class="f">${t.formula}</div><div class="notes">${notes}</div>
    ${vs.length?CF.diagram(vs[0],{width:100}):"<p>—</p>"}
    ${alt?`<div class="more">altre posizioni</div><div class="alt">${alt}</div>`:""}</div>`;
}
function render(){
  document.querySelectorAll("#nota button").forEach(b=>b.classList.toggle("on", b.dataset.v===st.nota));
  document.querySelectorAll("#mode button").forEach(b=>b.classList.toggle("on", b.dataset.v===st.mode));
  document.getElementById("roots").style.display = st.mode==="root"?"flex":"none";
  document.getElementById("types").style.display = st.mode==="type"?"flex":"none";
  document.getElementById("roots").innerHTML = CF.ROOTS.map(r=>`<button data-r="${r}" class="${r===st.root?"on":""}">${N(r)}</button>`).join("");
  document.getElementById("types").innerHTML = CF.TYPES.map(t=>`<button title="${t.formula}" data-t="${t.id}" class="${t.id===st.type?"on":""}">${t.label}</button>`).join("");
  const q = document.getElementById("search").value.trim();
  let html, title;
  if (q) {
    const norm = x => x.replace(/^(do|re|mi|fa|sol|la|si)(?=[#b]?(m|maj|min|dim|aug|sus|add|\d|\+|°|$))/i, m=>m.toUpperCase()).replace(/^[a-g]/, m=>m.toUpperCase());
    const qn = q.split("/").map(norm).join("/");
    const c = CF.parseChord(qn);
    if (!c) { title=`“${q}”: accordo non riconosciuto`; html=""; }
    else { title=`Risultato per “${q}”`; html = card(c.root, c.type, q + (c.bass?"":""));
      if (c.bass) { const cv = CF.chordVoicing(qn); if (cv.bassOk) html += `<div class="ch"><div class="n">${q}</div><div class="t">con il basso</div>${CF.diagram(cv.v,{width:100})}</div>`;
        html += `<p class="hint" style="grid-column:1/-1">${q}: è l'accordo ${N(c.root)}${CF.TYPE[c.type].suf} con al basso la nota ${N(c.bass)}.</p>`; }
      if (c.approx) html += `<p class="hint" style="grid-column:1/-1">Mostro la forma base più vicina.</p>`; }
  } else if (st.mode==="root") {
    title = `Accordi di ${N(st.root)}`; html = [...new Set(CF.TYPES.map(t=>t.g))].map(g=>`<h3 class="grp">${g}</h3>`+CF.TYPES.filter(t=>t.g===g).map(t=>card(st.root, t.id)).join("")).join("");
  } else {
    title = `Accordi: ${CF.TYPE[st.type].label} (${CF.TYPE[st.type].formula})`; html = CF.ROOTS.map(r=>card(r, st.type)).join("");
  }
  document.getElementById("title").textContent = title;
  document.getElementById("grid").innerHTML = html;
  save();
}
document.getElementById("nota").onclick = e=>{ if(e.target.dataset.v){ st.nota=e.target.dataset.v; render(); } };
document.getElementById("mode").onclick = e=>{ if(e.target.dataset.v){ st.mode=e.target.dataset.v; document.getElementById("search").value=""; render(); } };
document.getElementById("roots").onclick = e=>{ if(e.target.dataset.r){ st.root=e.target.dataset.r; render(); } };
document.getElementById("types").onclick = e=>{ if(e.target.dataset.t){ st.type=e.target.dataset.t; render(); } };
document.getElementById("search").oninput = render;
const qp = new URLSearchParams(location.search).get("c"); if (qp) document.getElementById("search").value = qp;
render();
</script>
</body></html>
